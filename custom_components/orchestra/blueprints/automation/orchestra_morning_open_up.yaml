blueprint:
  name: Overture - Morning open-up
  description: >-
    Opens the living area blinds and curtains at sunrise (not before the earliest time
    set in Overture, 6 am by default) and the bedroom ones at the household's wake
    time (7 am by default). Blinds the heat shield is keeping shut stay shut. The times
    are on calendar.orchestra_today. Skip today and the rhythm's switch
    (switch.orchestra_rhythm_morning_open_up) pause it.
  domain: automation
  author: Weaponised Nerds
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/Weaponised-Nerds/overture/blob/main/custom_components/orchestra/blueprints/automation/orchestra_morning_open_up.yaml
  input:
    living_covers:
      name: Living area blinds and curtains
      default: []
      selector:
        entity:
          filter:
            - domain: cover
          multiple: true
    bedroom_covers:
      name: Bedroom blinds and curtains
      default: []
      selector:
        entity:
          filter:
            - domain: cover
          multiple: true
    today_calendar:
      name: Overture today calendar
      default: calendar.orchestra_today
      selector:
        entity:
          filter:
            - integration: orchestra
              domain: calendar

mode: queued
max: 5
max_exceeded: silent

triggers:
  - trigger: calendar
    event: start
    entity_id: !input today_calendar

variables:
  living_covers: !input living_covers
  bedroom_covers: !input bedroom_covers

conditions:
  - condition: template
    value_template: "{{ '[orchestra:morning_open_up:' in (trigger.calendar_event.description | default('')) }}"

actions:
  - variables:
      group: >-
        {{ trigger.calendar_event.description
           | regex_findall('\\[orchestra:morning_open_up:([a-z0-9]+)\\]') | first | default('') }}
  - action: orchestra.rhythm_step
    data:
      rhythm: morning_open_up
      phase: start
      group: "{{ group }}"
      entity_id: "{{ bedroom_covers if group == 'bedrooms' else living_covers }}"
