      input-outlined-idle-border-color: "#C4C6C5"
      input-outlined-hover-border-color: "#4A5A60"
      mdc-text-field-fill-color: "#FFFFFF"
      mdc-select-fill-color: "#FFFFFF"

      code-editor-background-color: "#F6F8F7"
      markdown-code-background-color: "#DCEBEA"
      table-row-background-color: "#FFFFFF"
      table-row-alternative-background-color: "#F6F8F7"
      data-table-background-color: "#FFFFFF"

      # Energy dashboard: teal for "ours", deep for the grid benchmark, fog for neutral
      energy-grid-consumption-color: "#0E2A33"
      energy-grid-return-color: "#4A5A60"
      energy-solar-color: "#D49A1E"
      energy-non-fossil-color: "#1F7A7A"
