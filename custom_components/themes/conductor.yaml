# Conductor theme for Home Assistant
# Matches the Conductor web app (conductor.deezlepower.com): petrol and teal,
# Manrope / Inter / IBM Plex Mono, flat cards with 1px borders, dark top bar in both modes.
# Tokens: /brand/conductor-tokens.css and the app's public/css/brand.css.
# Fonts are not loaded by this file. See README.md for adding them.

Conductor:
  # ---- Shared by both modes -------------------------------------------------

  # Typography
  primary-font-family: '"Inter", system-ui, -apple-system, "Segoe UI", sans-serif'
  paper-font-common-base_-_font-family: '"Inter", system-ui, -apple-system, "Segoe UI", sans-serif'
  paper-font-common-code_-_font-family: '"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace'
  paper-font-body1_-_font-family: '"Inter", system-ui, sans-serif'
  paper-font-subhead_-_font-family: '"Inter", system-ui, sans-serif'
  paper-font-headline_-_font-family: '"Manrope", "Inter", system-ui, sans-serif'
  paper-font-title_-_font-family: '"Manrope", "Inter", system-ui, sans-serif'
  mdc-typography-font-family: '"Inter", system-ui, sans-serif'
  ha-font-family-body: '"Inter", system-ui, -apple-system, "Segoe UI", sans-serif'
  ha-font-family-heading: '"Manrope", "Inter", system-ui, sans-serif'
  ha-font-family-code: '"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace'
  ha-card-header-font-family: '"Manrope", "Inter", system-ui, sans-serif'
  app-header-font-family: '"Manrope", "Inter", system-ui, sans-serif'

  # Shape: flat cards separated by a border, not a shadow
  ha-card-border-radius: 8px
  ha-card-border-width: 1px
  ha-card-box-shadow: none
  ha-dialog-border-radius: 12px
  ha-border-radius-sm: 4px
  ha-border-radius-md: 8px
  ha-border-radius-lg: 12px
  mdc-shape-small: 4px
  mdc-shape-medium: 8px
  mdc-shape-large: 12px
  ha-badge-border-radius: 4px

  # Top bar: deep in both modes, like the app
  app-header-background-color: "#0A2129"
  app-header-text-color: "#FFFFFF"
  app-header-edit-background-color: "#1C4652"
  app-header-edit-text-color: "#FFFFFF"
  app-header-border-bottom: "1px solid #23434B"
  app-header-selection-bar-color: "#3BAFB0"

  modes:
    # ---- Light (Paper) ------------------------------------------------------
    light:
      primary-color: "#1F7A7A"
      dark-primary-color: "#0E2A33"
      light-primary-color: "#DCEBEA"
      accent-color: "#1F7A7A"
      rgb-primary-color: "31, 122, 122"
      rgb-accent-color: "31, 122, 122"
      text-primary-color: "#FFFFFF"
      text-light-primary-color: "#14262C"
      mdc-theme-primary: "#1F7A7A"
      mdc-theme-secondary: "#1F7A7A"
      mdc-theme-on-primary: "#FFFFFF"

      primary-background-color: "#F6F8F7"
      secondary-background-color: "#F6F8F7"
      lovelace-background: "#F6F8F7"
      card-background-color: "#FFFFFF"
      ha-card-background: "#FFFFFF"
      ha-card-border-color: "#C4C6C5"
      ha-dialog-surface-background: "#FFFFFF"
      mdc-theme-surface: "#FFFFFF"
      clear-background-color: "#FFFFFF"

      primary-text-color: "#14262C"
      rgb-primary-text-color: "20, 38, 44"
      secondary-text-color: "#4A5A60"
      ha-card-header-color: "#0E2A33"
      disabled-text-color: "#B0BCBB"
      divider-color: "#E4E6E5"
      outline-color: "#C4C6C5"
      mdc-theme-text-primary-on-background: "#14262C"
      mdc-theme-text-secondary-on-background: "#4A5A60"

      sidebar-background-color: "#FFFFFF"
      sidebar-text-color: "#14262C"
      sidebar-icon-color: "#4A5A60"
      sidebar-selected-text-color: "#0E2A33"
      sidebar-selected-icon-color: "#1F7A7A"
      sidebar-menu-button-background-color: "#0A2129"
      sidebar-menu-button-text-color: "#FFFFFF"

      state-icon-color: "#4A5A60"
      paper-item-icon-color: "#4A5A60"
      state-icon-active-color: "#1F7A7A"
      paper-item-icon-active-color: "#1F7A7A"
      state-active-color: "#1F7A7A"
      state-inactive-color: "#B0BCBB"
      state-on-color: "#1F7A7A"
      state-off-color: "#B0BCBB"
      state-unavailable-color: "#C9D6D5"
      history-unavailable-color: "#E4E6E5"
      history-unknown-color: "#C9D6D5"

      success-color: "#1F7A7A"
      info-color: "#4A5A60"
      warning-color: "#A8701A"
      error-color: "#9A3F2C"

      switch-checked-color: "#1F7A7A"
