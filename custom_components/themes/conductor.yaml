      switch-checked-track-color: "#1F7A7A"
      switch-unchecked-button-color: "#FFFFFF"
      switch-unchecked-track-color: "#B0BCBB"
      slider-color: "#1F7A7A"
      slider-bar-color: "#C9D6D5"
      paper-slider-knob-color: "#1F7A7A"
      paper-slider-active-color: "#1F7A7A"
      paper-slider-container-color: "#C9D6D5"

      input-fill-color: "#FFFFFF"
      input-disabled-fill-color: "#F6F8F7"
      input-ink-color: "#14262C"
      input-label-ink-color: "#4A5A60"
      input-idle-line-color: "#C4C6C5"
